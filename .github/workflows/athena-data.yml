name: athena-data

# Fetches 1H candles for the top-30 liquid USDC pairs (chunked 2300d)
# and uploads the db as an artifact. The Athena training itself stays
# LOCAL — only the raw public candle data flows through GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt
      - name: Decompress committed 4H universe (for the liquid ranking)
        run: gunzip -c data/universe.db.gz > data/universe.db
      - name: Fetch 1H candles
        run: python fetch_1h.py
      - name: Upload 1H database
        uses: actions/upload-artifact@v4
        with:
          name: athena-1h-data
          path: data/athena_1h.db
          retention-days: 7
