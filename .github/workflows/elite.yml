name: elite

# Quarterly full-history validation: 10-fold walk-forward over the
# maximum available BTC+ETH history (6+ years). The graduation bar:
# mean fold excess >= +8% AND >= 6 trades/fold AND >= 7/10 folds won.
# (Nobody passed on 2020-2026 data — the 2020-21 mega-bull makes
# buy&hold unbeatable; results are ranked by absolute return + fold
# consistency instead. mtf_trend is the standing champion: 8/10
# positive folds, +4.7%/fold, +210% full-span, worst fold -5.1%.)
on:
  workflow_dispatch:
    inputs:
      folds:
        description: "Walk-forward folds"
        required: false
        default: "10"
  schedule:
    - cron: "0 4 1 */3 *"   # quarterly

permissions:
  contents: write

jobs:
  elite:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt
      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Download max history (BTC/ETH USDC)
        run: |
          python - << 'EOF'
          import sys, time
          sys.path.insert(0, ".")
          from datetime import datetime, timedelta, timezone
          from bot.config import BotConfig
          from bot.data.fetcher import fetch_candles
          from bot.data.store import Store
          cfg = BotConfig.from_yaml()
          store = Store("data/sim6y.db")
          end = datetime.now(timezone.utc)
          start = end - timedelta(days=2300)
          for pair in ("BTC-USDC", "ETH-USDC"):
              for attempt in range(4):
                  try:
                      df = fetch_candles(pair, cfg.granularity, start, end)
                      if not df.empty:
                          store.upsert_candles(pair, cfg.granularity, df)
                          print(f"[elite-data] {pair}: {len(df)} bars")
                      break
                  except Exception as exc:
                      print(f"[elite-data] {pair} retry {attempt+1}: {exc}")
                      time.sleep(10 * (attempt + 1))
          EOF
      - name: Run elite trainer
        run: |
          FOLDS="${{ github.event.inputs.folds || '10' }}"
          python run_elite.py --db data/sim6y.db --folds "$FOLDS"
      - name: Commit results
        run: |
          git config user.name "lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ || true
          git commit -m "elite: full-history validation $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
