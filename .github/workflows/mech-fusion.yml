name: mech-fusion

# Mechanical-fusion lab: AI model receives raw data AND mechanical
# rule outputs (discovered gates, trend stacks, breakouts, BTC regime,
# density, time cycles) and composes them. Ablations: pure mechanical,
# raw-only, fusion, gated fat-tail ranking. Research only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt scikit-learn
      - name: Decompress committed 4H universe
        run: gunzip -c data/universe.db.gz > data/universe.db
      - name: Train mechanical-fusion lab
        run: python nn_lab/mech_fusion_lab.py
      - name: Upload report and probabilities
        uses: actions/upload-artifact@v4
        with:
          name: mech-fusion-report
          path: |
            reports/mech_fusion_lab.json
            reports/mech_fusion_lab_probs.npz
          retention-days: 7
