name: final-train

# ONE-SHOT complete model: fetch full 1H history (9y), resample to
# 4H, top-13 coins, train the mechanical-fusion model once, emit the
# serialized booster + policy card. No schedule — runs on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt scikit-learn
      - name: Decompress committed 4H universe (volume ranking for fetch)
        run: gunzip -c data/universe.db.gz > data/universe.db
      - name: Fetch full 1H history (top-20, chunked)
        run: python fetch_full_1h.py
      - name: Train final model (9y, top-13, 4H)
        run: python nn_lab/final_train.py
      - name: Upload complete model
        uses: actions/upload-artifact@v4
        with:
          name: final-model
          path: |
            reports/final_model.json
            reports/final_model.txt
            reports/final_model_probs.npz
          retention-days: 14
