name: continuous-train

# The never-stop improvement loop: roll-forward retraining with
# realized-EV champion gating. Scheduled weekly (Mon 00:00 UTC) and
# on demand. If no band beats the EV floor, the policy card is
# withheld (honest stop — no forced trading).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt scikit-learn
      - name: Decompress committed 4H universe
        run: gunzip -c data/universe.db.gz > data/universe.db
      - name: Run continuous training cycle
        run: python nn_lab/continuous_train.py
      - name: Upload champion policy card
        uses: actions/upload-artifact@v4
        with:
          name: continuous-champion
          path: |
            reports/continuous_champion.json
            reports/continuous_champion_model.npz
          retention-days: 14
