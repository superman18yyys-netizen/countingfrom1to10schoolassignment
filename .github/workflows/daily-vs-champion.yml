name: daily-vs-champion

# Head-to-head: the daily mechanical-fusion bot vs the gen2b champion
# on the same $100, same fees, same walk-forward discipline. Fetches
# full 1H, trains per fold, compounds one account, reports both.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt scikit-learn
      - name: Decompress committed 4H universe (volume ranking for fetch)
        run: gunzip -c data/universe.db.gz > data/universe.db
      - name: Fetch full 1H history (top-20, chunked)
        run: python fetch_full_1h.py
      - name: Run daily bot vs champion comparison
        run: python nn_lab/daily_vs_champion.py
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: daily-vs-champion-report
          path: reports/daily_vs_champion.json
          retention-days: 14
