name: a000

# A-000 long-year paper test: downloads the full USDC universe,
# computes the perfect-foresight ORACLE ceiling, runs the A-000
# core-satellite allocator over the full 6y history ($100 start),
# walk-forward validates the config, and commits the report.
# This IS the "paper long-year testing on the GitHub server".
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 0"   # weekly Sunday

permissions:
  contents: write

jobs:
  a000:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt
      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Fetch universe (backward paging, all 19 USDC pairs)
        run: python fetch_universe.py
      - name: Run A-000 full-history paper test
        run: python run_a000.py --db data/universe.db --folds 10 --capital 100
      - name: Commit report
        run: |
          git config user.name "a000-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/a000-results.json || true
          git commit -m "a000: paper long-year test $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
