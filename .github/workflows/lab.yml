name: lab

# Continuous R&D: every week, re-run the invention lab (walk-forward
# training + one-shot validation of all registered ideas) and commit
# the leaderboard. New ideas get registered in run_lab.py IDEAS.
on:
  workflow_dispatch:
    inputs:
      folds:
        description: "Walk-forward folds"
        required: false
        default: "5"
  schedule:
    - cron: "40 3 * * 1"   # weekly, Monday 03:40 UTC (after simulate)

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt
      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Download fresh data
        run: |
          python - << 'EOF'
          import sys, time
          sys.path.insert(0, ".")
          from datetime import datetime, timedelta, timezone
          from bot.config import BotConfig
          from bot.data.fetcher import fetch_candles
          from bot.data.store import Store
          cfg = BotConfig.from_yaml()
          store = Store("data/sim.db")
          end = datetime.now(timezone.utc)
          start = end - timedelta(days=730)
          for pair in cfg.pairs:
              for attempt in range(4):
                  try:
                      df = fetch_candles(pair, cfg.granularity, start, end)
                      if not df.empty:
                          store.upsert_candles(pair, cfg.granularity, df)
                          print(f"[lab-data] {pair}: {len(df)} bars")
                      break
                  except Exception as exc:
                      print(f"[lab-data] {pair} retry {attempt+1}: {exc}")
                      time.sleep(10 * (attempt + 1))
          EOF
      - name: Run R&D lab
        run: |
          FOLDS="${{ github.event.inputs.folds || '5' }}"
          python run_lab.py --folds "$FOLDS"
      - name: Commit results
        run: |
          git config user.name "lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ || true
          git commit -m "lab: R&D run $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
