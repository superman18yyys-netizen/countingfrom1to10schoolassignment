name: simulate

# The lab: race every bot (and evolved variants) on REAL historical
# windows, rank them, and export champion candidates for the live repo.
on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of history to tournament over"
        required: false
        default: "90"
      window:
        description: "Window length in days"
        required: false
        default: "7"
      variants:
        description: "Random param variants to also race"
        required: false
        default: "40"
  schedule:
    - cron: "30 2 * * 1"   # weekly, Monday 02:30 UTC

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt
      - name: Install libomp (LightGBM on ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Run simulation tournament
        run: |
          DAYS="${{ github.event.inputs.days_back || '90' }}"
          WIN="${{ github.event.inputs.window || '7' }}"
          VAR="${{ github.event.inputs.variants || '40' }}"
          START=$(python3 -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc)-timedelta(days=int('$DAYS'))).strftime('%Y-%m-%d'))")
          python run_sim.py --start "$START" --window "$WIN" --step "$WIN" --variants "$VAR"
      - name: Commit results
        run: |
          git config user.name "sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ || true
          git commit -m "sim: tournament $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
