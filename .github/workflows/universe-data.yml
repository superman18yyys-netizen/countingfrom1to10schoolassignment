name: universe-data

# Fetches 6y of 4H candles for the expanded USDC universe and uploads
# it as an artifact for the A-000 lab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-swarm.txt
      - name: Install dependencies
        run: pip install -r requirements-swarm.txt
      - name: Fetch universe
        run: python fetch_universe.py
      - name: Upload universe database
        uses: actions/upload-artifact@v4
        with:
          name: universe-data
          path: data/universe.db
          retention-days: 7
